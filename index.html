<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | Your Title</title> <!-- This will be populated by JS -->
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Fira+Code&display=swap" rel="stylesheet">
</head>
<body>
    <div class="progress-bar-container">
        <div class="progress-bar"></div>
    </div>

    <div class="background-container">
        <div class="blob"></div>
    </div>

    <div class="container">
        <header class="main-header">
            <nav>
                <a href="#projects">Projects</a>
                <a href="#skills">Skills</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <main>
            <section id="hero" class="hero-section">
                <div class="hero-content">
                    <h1 id="hero-name" class="hero-name" data-text="Your Name">Your Name</h1>
                    <p id="hero-title" class="hero-title"></p>
                    <div class="hero-terminal">
                        <div class="terminal-header">
                            <div class="terminal-button red"></div>
                            <div class="terminal-button yellow"></div>
                            <div class="terminal-button green"></div>
                        </div>
                        <div class="terminal-body">
                            <p>$ <span id="terminal-text"></span><span class="cursor"></span></p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="about" class="content-section">
                <p id="profile-bio" class="about-bio"></p>
            </section>

            <section id="projects" class="content-section">
                <h2 class="section-title">Selected Projects</h2>
                <div id="projects-grid" class="projects-grid">
                    <!-- Project cards will be injected here by JS -->
                </div>
            </section>

            <section id="skills" class="content-section">
                <h2 class="section-title">Skills</h2>
                <div id="skills-grid" class="skills-grid">
                    <!-- Skill icons will be injected here by JS -->
                </div>
            </section>

            <section id="contact" class="content-section">
                <h2 class="section-title">Get In Touch</h2>
                <p class="contact-text">I'm always open to discussing new projects or opportunities. Feel free to reach out!</p>
                <div id="contact-links" class="contact-links">
                    <!-- Contact links will be dynamically inserted here -->
                </div>
            </section>
        </main>

        <footer class="main-footer">
            <div class="footer-content">
                <p>&copy; <span id="footer-year">2024</span> <span id="footer-name">Your Name</span>. All rights reserved.</p>
                <a id="resume-link" href="assets/resume.pdf" target="_blank" rel="noopener noreferrer" class="resume-link">View Resume</a>
            </div>
        </footer>
    </div>

    <script src="main.js"></script>
</body>
</html>
