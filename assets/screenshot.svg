  <!-- Projects Section (placeholder) -->
  <rect x="50" y="500" width="220" height="120" rx="8" fill="#1f2937" stroke="#374151" />
  <rect x="290" y="500" width="220" height="120" rx="8" fill="#1f2937" stroke="#374151" />
  <rect x="530" y="500" width="220" height="120" rx="8" fill="#1f2937" stroke="#374151" />

</svg>
