  <rect x="325" y="280" width="150" height="40" rx="5" fill="#a855f7" />
  <text x="400" y="305" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">View Resume</text>

  <!-- About Section -->
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="28" fill="#fde047" text-anchor="middle">About Me</text>
  <rect x="100" y="410" width="600" height="3" fill="#a855f7" transform="translate(-100, -13)" />
