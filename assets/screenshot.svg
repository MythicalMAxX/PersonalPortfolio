<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" style="background-color: #111827;">
  <!-- Header -->
  <rect x="0" y="0" width="800" height="50" fill="#1f2937" />
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="16" fill="#e5e7eb" text-anchor="middle">About  |  Projects  |  Contact</text>

  <!-- Hero Section -->
